<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--navy-800); font-family: var(--font-body); display: flex; align-items: center; justify-content: center; height: 300px; gap: 56px; }
  img { height: 150px; }
  .swatch { display:flex; flex-direction:column; gap:10px; }
  .min { display:flex; align-items:center; gap:12px; }
  .min span:first-child { width: 22px; height: 4px; background: var(--accent); border-radius: 2px; }
  .min span:last-child { color: var(--ink-muted); font-size: 18px; font-weight: 600; }
  .cap { color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 0.04em; }
</style></head>
<body>
<img src="../assets/logo-white-tight.png" alt="Gümrükte Güncel">
<div class="swatch">
  <div class="min"><span></span><span>Gümrükte Güncel</span></div>
  <div class="cap">standing corner tag (BrandTag)</div>
</div>
</body></html>
