<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="8px rhythm" -->
<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--navy-800); font-family: var(--font-body); padding: 26px 32px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .bar { height: 16px; background: var(--accent); border-radius: 3px; }
  .tok { color: #fff; font-size: 13px; font-weight: 700; width: 84px; }
  .val { color: rgba(255,255,255,0.45); font-size: 12px; }
</style></head>
<body>
<div class="row"><span class="tok">space-1</span><span class="bar" style="width:8px"></span><span class="val">8px</span></div>
<div class="row"><span class="tok">space-2</span><span class="bar" style="width:16px"></span><span class="val">16px</span></div>
<div class="row"><span class="tok">space-3</span><span class="bar" style="width:24px"></span><span class="val">24px</span></div>
<div class="row"><span class="tok">space-4</span><span class="bar" style="width:32px"></span><span class="val">32px</span></div>
<div class="row"><span class="tok">space-5</span><span class="bar" style="width:48px"></span><span class="val">48px</span></div>
<div class="row"><span class="tok">space-6</span><span class="bar" style="width:64px"></span><span class="val">64px</span></div>
<div class="row"><span class="tok">space-7</span><span class="bar" style="width:88px"></span><span class="val">88px · post margin</span></div>
</body></html>
