<!-- @dsCard group="Type" viewport="700x210" name="Hero stat" subtitle="The oversized yellow figure" -->
<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--navy-800); font-family: var(--font-display); padding: 24px 32px; display:flex; flex-direction:column; justify-content:center; height: calc(210px - 48px); }
  .stat { display: flex; align-items: baseline; gap: 14px; }
  .num { color: var(--accent); font-weight: 900; font-size: 132px; letter-spacing: -0.03em; line-height: 0.9; }
  .unit { color: var(--accent); font-weight: 800; font-size: 46px; letter-spacing: -0.02em; }
  .meta { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; margin-top: 16px; }
</style></head>
<body>
<div class="stat"><span class="num">730</span><span class="unit">GÜN</span></div>
<div class="meta">Archivo · 900 · ~200px @ 1080² · always yellow · one per post</div>
</body></html>
