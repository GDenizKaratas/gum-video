<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--navy-800); font-family: var(--font-body); padding: 30px 32px; display: flex; flex-direction: column; gap: 22px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
  .bar { width: 36px; height: 3px; background: var(--accent); }
  .accent { color: var(--accent); }
  .faint { color: var(--ink-faint); }
  .meta { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
</style></head>
<body>
<div class="eyebrow accent"><span class="bar"></span>2026 GÜNCEL</div>
<div class="eyebrow faint">BİLGİ NOTU · İHRACAT</div>
<div class="meta">Archivo · 700 · UPPERCASE · letter-spacing 0.22em</div>
</body></html>
