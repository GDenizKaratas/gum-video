<!-- @dsCard group="Colors" viewport="700x190" name="Navy field" subtitle="The brand background scale" -->
<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .sw { height: 190px; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; }
  .name { color: #fff; font-size: 14px; font-weight: 700; }
  .hex { color: rgba(255,255,255,0.55); font-size: 12px; font-weight: 500; letter-spacing: 0.02em; margin-top: 2px; }
  .role { color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 6px; }
</style></head>
<body>
<div class="grid">
  <div class="sw" style="background:var(--navy-900)"><div class="name">navy-900</div><div class="hex">#0A1830</div><div class="role">vignette / edges</div></div>
  <div class="sw" style="background:var(--navy-800)"><div class="name">navy-800</div><div class="hex">#0F2244</div><div class="role">primary bg</div></div>
  <div class="sw" style="background:var(--navy-700)"><div class="name">navy-700</div><div class="hex">#15294F</div><div class="role">panels</div></div>
  <div class="sw" style="background:var(--navy-600)"><div class="name">navy-600</div><div class="hex">#1B3463</div><div class="role">motif fills</div></div>
</div>
</body></html>
