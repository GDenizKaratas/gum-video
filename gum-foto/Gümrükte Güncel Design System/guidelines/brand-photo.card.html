<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: #07101f; font-family: var(--font-body); display: flex; gap: 22px; padding: 26px 28px; }
  .tile { position: relative; width: 268px; height: 268px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wash { position: absolute; inset: 0; background: rgba(15,34,68,0.46); }
  .scrim-b { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,24,48,0) 0%, rgba(10,24,48,0.12) 40%, rgba(10,24,48,0.78) 78%, rgba(10,24,48,0.95) 100%); }
  .scrim-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,24,48,0.95) 0%, rgba(10,24,48,0.7) 38%, rgba(10,24,48,0.15) 72%, rgba(10,24,48,0) 100%); }
  .body { position: absolute; inset: 0; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; }
  .eb { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
  .ttl { color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 30px; line-height: 1.0; letter-spacing: -0.02em; text-shadow: 0 2px 16px rgba(7,16,31,0.5); }
  .lab { color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 8px; }
</style></head>
<body>
<div>
  <div class="tile">
    <img src="../assets/photos/liman-gemi.png" alt="">
    <div class="wash"></div><div class="scrim-b"></div>
    <div class="body" style="justify-content:flex-end;gap:12px">
      <span class="eb">İHRACAT</span>
      <span class="ttl">İhracatta gümrük süreçleri</span>
    </div>
  </div>
  <div class="lab">scrim="bottom" · alt yazı</div>
</div>
<div>
  <div class="tile">
    <img src="../assets/photos/arac-arazi.png" alt="">
    <div class="wash"></div><div class="scrim-l"></div>
    <div class="body" style="justify-content:center;gap:12px">
      <span class="eb">YABANCI PLAKA</span>
      <span class="ttl" style="max-width:170px">730 gün<br>kuralı</span>
    </div>
  </div>
  <div class="lab">scrim="left" · sol yazı</div>
</div>
</body></html>
