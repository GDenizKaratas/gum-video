<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gümrükte Güncel — Uyarı</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; height: 100%; background: #07101f; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #scaler { width: 1080px; height: 1080px; transform-origin: center center; }
</style>
</head>
<body>
<div id="stage"><div id="scaler"><div id="frame"></div></div></div>
<script type="text/babel" src="./Post.jsx"></script>
<script type="text/babel" data-presets="env,react">
  function fit() {
    const m = 0.94;
    const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1080) * m;
    document.getElementById('scaler').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  (function mount() {
    const ns = window.GMrKteGNcelDesignSystem_500523;
    if (!ns || !window.WarningPost) { setTimeout(mount, 40); return; }
    const Post = window.WarningPost;
    ReactDOM.createRoot(document.getElementById('frame')).render(<Post />);
  })();
</script>
</body>
