<!-- @dsCard group="Posts" viewport="1048x1180" name="Açılış seti — 4 gönderi" subtitle="Karşılama · Değer · Uyarı · Güncel (1080×1080)" -->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<title>Gümrükte Güncel — Açılış Seti</title>
<style>
  html, body { margin: 0; background: #07101f; font-family: 'Archivo', sans-serif; }
  .gallery { width: 1048px; box-sizing: border-box; padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px 40px; }
  .item { display: flex; flex-direction: column; gap: 14px; }
  .thumb { width: 464px; height: 464px; border-radius: 10px; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,0.4); }
  .thumb > div { transform: scale(0.42962); transform-origin: top left; }
  .cap { display: flex; align-items: baseline; gap: 12px; }
  .num { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: 0.04em; }
  .name { color: #fff; font-weight: 700; font-size: 16px; }
  .desc { color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.GG_ASSET_BASE = '../assets';</script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel" src="../templates/welcome-post/Post.jsx"></script>
<script type="text/babel" src="../templates/value-post/Post.jsx"></script>
<script type="text/babel" src="../templates/warning-post/Post.jsx"></script>
<script type="text/babel" src="../templates/update-post/Post.jsx"></script>
<script type="text/babel" src="../templates/photo-post/Post.jsx"></script>
<script type="text/babel" data-presets="env,react">
  const ITEMS = [
    { n: '01', key: 'WelcomePost', name: 'Karşılama', desc: 'Kimlik · açılış' },
    { n: '02', key: 'ValuePost', name: 'Değer', desc: 'Bilgilendirici · stat' },
    { n: '03', key: 'WarningPost', name: 'Uyarı', desc: 'Kanca · uyarı şeridi' },
    { n: '04', key: 'UpdatePost', name: 'Güncel', desc: 'Mevzuat takibi' },
    { n: '05', key: 'PhotoPost', name: 'Fotoğraflı', desc: 'Foto arka plan · scrim' },
  ];
  function Gallery() {
    return (
      <div className="gallery">
        {ITEMS.map(it => {
          const Post = window[it.key];
          return (
            <div className="item" key={it.key}>
              <div className="thumb"><div>{Post ? <Post /> : null}</div></div>
              <div className="cap"><span className="num">{it.n}</span><span className="name">{it.name}</span><span className="desc">{it.desc}</span></div>
            </div>
          );
        })}
      </div>
    );
  }
  (function mount() {
    const ns = window.GMrKteGNcelDesignSystem_500523;
    if (!ns || !window.WelcomePost || !window.ValuePost || !window.WarningPost || !window.UpdatePost || !window.PhotoPost) { setTimeout(mount, 40); return; }
    ReactDOM.createRoot(document.getElementById('root')).render(<Gallery />);
  })();
</script>
</body>
</html>
