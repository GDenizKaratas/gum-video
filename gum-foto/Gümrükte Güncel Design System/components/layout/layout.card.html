<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: #11203c; }
  .wrap { display: flex; gap: 28px; align-items: center; padding: 28px; box-sizing: border-box; }
  .frame-scale { width: 374px; height: 374px; flex-shrink: 0; }
  .frame-scale > div { transform: scale(0.3463); transform-origin: top left; }
  .col { display: flex; flex-direction: column; gap: 22px; }
  .lab { font: 600 12px/1.3 'Archivo', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .panel { background: #0F2244; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 22px 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { PostFrame, BrandTag, Eyebrow, Highlight } = window.GMrKteGNcelDesignSystem_500523;
  function Demo() {
    return (
      <div className="wrap">
        <div className="frame-scale">
          <PostFrame motif="combo" handle="@gumrukteguncel">
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: 28 }}>
              <Eyebrow tone="accent" rule>2026 GÜNCEL</Eyebrow>
              <div style={{ fontSize: 'var(--fs-h1)', fontWeight: 900, lineHeight: 0.98, letterSpacing: '-0.02em' }}>
                Kurallar sürekli <Highlight>değişiyor</Highlight>
              </div>
            </div>
          </PostFrame>
        </div>
        <div className="col">
          <div>
            <div className="lab" style={{ marginBottom: 12 }}>BrandTag</div>
            <div className="panel"><BrandTag /></div>
          </div>
          <div>
            <div className="lab" style={{ marginBottom: 12 }}>with handle</div>
            <div className="panel"><BrandTag handle="@gumrukteguncel" /></div>
          </div>
          <div>
            <div className="lab" style={{ marginBottom: 12 }}>no emoji</div>
            <div className="panel"><BrandTag customs={false} /></div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
